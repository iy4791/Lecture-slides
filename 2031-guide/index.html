<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Phone-first companion to the projected deck: same cobalt-on-paper identity, one column,
   slide image on top, the summary in the viewer's language below, fixed prev/next bar.
   Deliberately single light look (matches the projector), every color explicit. */
:root{
  --paper:#F5F7FC; --ink:#0D1A3F; --muted:#4E5D85; --cobalt:#1B44D8; --deep:#0B2B9C;
  --tint:#DDE5FB; --tint2:#BCCBF6; --white:#FFFFFF; --rule:rgba(13,26,63,.14);
  --f-d:"Archivo","IBM Plex Sans JP",sans-serif;
  --f-ja:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-zh:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-lat:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper);color:var(--ink)}
body{margin:0;font-family:var(--f-ja);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
[lang|="zh"]{font-family:var(--f-zh)}
[lang="vi"],[lang="mn"]{font-family:var(--f-lat)}
.wrap{max-width:640px;margin:0 auto}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-top:12px;border-bottom:1px solid var(--rule)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-family:var(--f-d);font-stretch:70%;font-weight:800;font-size:28px;color:var(--cobalt);line-height:1}
.brand span{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langbtn{border:1px solid var(--rule);background:var(--white);padding:7px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px}
.tabs button{border:0;background:none;padding:10px 4px 12px;font-size:15px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--cobalt);border-bottom-color:var(--cobalt);font-weight:700}

/* slides */
.strip{display:flex;gap:6px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:thin}
.strip button{flex:none;width:44px;height:44px;border:1px solid var(--rule);background:var(--white);font-family:var(--f-m);font-size:15px;cursor:pointer}
.strip button.v{border-color:var(--tint2);background:var(--tint)}
.strip button[aria-current="true"]{background:var(--cobalt);border-color:var(--cobalt);color:var(--white)}
.hint{font-size:13px;color:var(--muted);margin:2px 0 12px}
.card{background:var(--white);border:1px solid var(--rule)}
.shot{display:block;width:100%;height:auto;aspect-ratio:16/9;background:var(--tint);border-bottom:1px solid var(--rule)}
.cbody{padding:16px 18px 20px;display:grid;gap:12px}
.no{font-family:var(--f-m);font-size:13px;color:var(--cobalt);letter-spacing:.08em}
.ttl{font-size:22px;line-height:1.45;margin:0;font-weight:700;text-wrap:balance}
.pts{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pts li{font-size:17px;line-height:1.7;padding-left:16px;position:relative}
.pts li::before{content:"";position:absolute;left:0;top:.72em;width:7px;height:7px;background:var(--cobalt)}
.act{display:flex;flex-wrap:wrap;gap:10px}
.act a,.act button{display:inline-flex;align-items:center;gap:8px;background:var(--cobalt);color:var(--white);text-decoration:none;border:0;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
details.orig{border-top:1px dashed var(--tint2);padding-top:10px}
details.orig summary{font-size:13px;color:var(--muted);cursor:pointer}
details.orig .ttl{font-size:17px;margin-top:8px}
details.orig .pts li{font-size:15px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--ink);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .wrap{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.bar button{border:0;background:var(--cobalt);color:var(--white);font-size:16px;font-weight:700;padding:13px 10px;cursor:pointer}
.bar button:disabled{opacity:.35;cursor:default}
.bar .pos{color:var(--white);font-family:var(--f-m);font-size:16px;min-width:64px;text-align:center}

/* video */
.vsec{display:grid;gap:18px;padding-top:16px}
.vcard{background:var(--white);border:1px solid var(--rule);padding:14px}
.vcard h2{font-size:18px;margin:0 0 10px}
.vcard video{display:block;width:100%;height:auto;aspect-ratio:16/9;background:var(--ink)}
.note{font-size:14px;line-height:1.7;color:var(--muted);background:var(--tint);padding:10px 12px}

/* words */
.wlist{display:grid;gap:8px;padding-top:16px}
.w{background:var(--white);border:1px solid var(--rule);padding:12px 14px;display:grid;gap:4px}
.w .j{font-size:20px;font-weight:700}
.w .j rt{font-size:.5em;color:var(--muted);font-weight:500}
.w .t{font-size:16px;color:var(--deep)}
.w .t small{display:block;font-size:13px;color:var(--muted)}

/* language picker */
.picker{position:fixed;inset:0;z-index:20;background:var(--deep);color:var(--white);display:flex;align-items:center;justify-content:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.picker .in{width:100%;max-width:420px;display:grid;gap:12px}
.picker .y{font-family:var(--f-d);font-stretch:62%;font-weight:800;font-size:72px;line-height:.9;color:var(--tint2)}
.picker p{margin:0 0 6px;font-size:15px;line-height:1.8;color:var(--tint)}
.picker button{display:flex;justify-content:space-between;align-items:center;border:0;background:var(--white);color:var(--ink);padding:16px 18px;font-size:20px;font-weight:700;cursor:pointer;text-align:left}
.picker button small{font-family:var(--f-m);font-size:12px;color:var(--muted);font-weight:500}
</style>

<div class="picker" id="picker" hidden>
  <div class="in">
    <div class="y">2031</div>
    <p>言語を選んでください<br><span lang="zh-CN">请选择语言</span> · <span lang="vi">Hãy chọn ngôn ngữ</span> · <span lang="mn">Хэлээ сонгоно уу</span></p>

</div>

<header><div class="wrap">
  <div class="top">
    <div class="brand"><b>2031</b><span>起業は Chance？ Risk？</span></div>
    <button type="button" class="langbtn" id="langBtn"></button>

  <div class="tabs" role="tablist">

</div></header>

<main class="wrap">
  <section id="p-slides">
    <div class="strip" id="strip"></div>
    <p class="hint" id="hint"></p>
    <article class="card" id="card">
      <img class="shot" id="shot" alt="" width="1280" height="720">
      <div class="cbody">

        <h1 class="ttl" id="ttl"></h1>

  <section id="p-video" hidden>
    <div class="vsec">
      <p class="note" id="vhint"></p>
      <div class="vcard" id="vc1"><h2 id="v1t"></h2>
        <video id="v1" controls playsinline preload="metadata" muted>
          <source src="video/video1.mp4" type="video/mp4">
        </video></div>
      <div class="vcard" id="vc2"><h2 id="v2t"></h2>
        <video id="v2" controls playsinline preload="metadata" muted>
          <source src="video/video2.mp4" type="video/mp4">
        </video></div>
    </div>
  </section>

  <section id="p-words" hidden>
    <div class="wlist" id="wlist"></div>
  </section>
</main>

["テーマ：チームで1つえらぶ", ["推し活×ファッション ／ ウェルネス×ファッション ／ 古着・循環", "伝統×いま ／ AI×わたしだけ ／ アジアへ売る"]], "zh": ["主题：小组选一个", ["追星×时尚 ／ 健康舒适×时尚 ／ 二手・循环", "传统×现在 ／ AI×专属于我 ／ 卖到亚洲"]], "vi": ["Chủ đề: mỗi nhóm chọn 1", ["Oshikatsu × Thời trang ／ Wellness × Thời trang ／ Đồ cũ・Tuần hoàn", "Truyền thống × Hiện đại ／ AI × Dành riêng cho tôi ／ Bán sang châu Á"]], "mn": ["Сэдэв: баг 1-ийг сонгоно", ["Ошикацү × Загвар ／ Веллнесс × Загвар ／ Хуучин хувцас・Дахин ашиглалт", "Уламжлал × Өнөө үе ／ AI × Зөвхөн надад ／ Ази руу борлуулах"]]}, {"ja": ["チームワーク①（25分）：だれの、どんなこまりごと？", ["① お客さんを1人に決める（年れい・仕事・好きなもの）", "② その人の「こまりごと」を3つ書く（AIで調べてOK・母国語OK）", "③ いちばん大きいこまりごとを1つえらぶ → ワークシート①②"]], "zh": ["小组练习①（25分钟）：是谁？有什么困扰？", ["① 确定一位顾客（年龄、工作、喜好）", "② 写出他的3个“困扰”（可以用AI调查，可以用母语）", "③ 选出最大的一个困扰 → 工作表①②"]], "vi": ["Làm việc nhóm ① (25 phút): Ai? Gặp khó khăn gì?", ["① Chọn 1 khách hàng (tuổi, công việc, sở thích)", "② Viết 3 “vấn đề khó khăn” của họ (dùng AI được, tiếng mẹ đẻ được)", "③ Chọn 1 vấn đề lớn nhất → Phiếu ①②"]], "mn": ["Багийн ажил ① (25 минут): Хэн, ямар асуудалтай вэ?", ["① Нэг хэрэглэгчийг сонгоно (нас, ажил, дуртай зүйл)", "② Түүний 3 «тулгамдсан асуудлыг» бичнэ (AI ашиглаж болно, эх хэлээр болно)", "③ Хамгийн том асуудлыг 1-ийг сонгоно → Ажлын хуудас ①②"]]}, {"ja": ["AIに聞いてみよう", ["例：20歳の推し活をしている女性が、服を買う時にこまっていることを5つ教えて。", "AIの答えは「たぶん」。本当かどうかはチームで話して決める。最後は日本語にしてチームに見せる。"]], "zh": ["问问AI吧", ["例：请告诉我20岁追星的女生买衣服时遇到的5个困扰。", "AI的答案只是“也许”。是否真实由小组讨论决定。最后翻译成日语给小组看。"]], "vi": ["Hãy hỏi AI", ["Ví dụ: Hãy cho tôi biết 5 khó khăn của phụ nữ 20 tuổi hâm mộ thần tượng khi mua quần áo.", "Câu trả lời của AI chỉ là “có lẽ”. Nhóm thảo luận để quyết định đúng hay không. Cuối cùng dịch sang tiếng Nhật cho nhóm xem."]], "mn": ["AI-аас асууцгаая", ["Жишээ: Шүтээнтэй 20 настай эмэгтэй хувцас худалдаж авахад тулгардаг 5 асуудлыг хэлж өгнө үү.", "AI-ийн хариулт бол «магадгүй». Үнэн эсэхийг багаараа ярилцаж шийднэ. Эцэст нь япон хэл рүү хөрвүүлж багтаа үзүүлнэ."]]}, {"ja": ["休憩 10分", ["先生が言った時間に、席にもどってください。"]], "zh": ["休息10分钟", ["请在老师说的时间回到座位。"]], "vi": ["Nghỉ giải lao 10 phút", ["Hãy quay lại chỗ ngồi đúng giờ giáo viên nói."]], "mn": ["10 минут завсарлага", ["Багшийн хэлсэн цагт суудалдаа буцаж ирээрэй."]]}, {"ja": ["PART 2：3つの構えと地雷（動画②）", ["上手な起業家がしていること。気をつけること。", "先生の合図で、下の「動画②を見る」から再生してください。自分の言葉の字幕が出ます。"]], "zh": ["第2部分：三种心态与地雷（视频②）", ["优秀创业者在做的事，以及需要注意的事。", "听到老师的信号后，点下面的“看视频②”播放。会显示你的语言的字幕。"]], "vi": ["PHẦN 2: 3 thái độ và “mìn” (Video ②)", ["Điều người khởi nghiệp giỏi đang làm, và điều cần chú ý.", "Khi giáo viên ra hiệu, bấm “Xem video ②” bên dưới để phát. Có phụ đề ngôn ngữ của bạn."]], "mn": ["2-р хэсэг: 3 хандлага ба «мина» (Видео ②)", ["Сайн бизнес эрхлэгчдийн хийдэг зүйл, анхаарах зүйл.", "Багшийн дохиогоор доорх «Видео ②-ыг үзэх»-ийг дарж тоглуулна уу. Өөрийн хэлний хадмал гарна."]], "video": 2}, {"ja": ["構え1：小さく試す", ["759の会社で実験した研究。「予想する→小さく試す→たしかめる」をした会社は、結果がよかった。", "この考え方は学べる。例：SNSで「ほしい？」と聞く。10人に見せて反応を見る。"]], "zh": ["心态1：小规模尝试", ["一项以759家公司为对象的实验研究：做到“预测→小规模尝试→验证”的公司结果更好。", "这种思考方式可以学会。例：在社交媒体上问“想要吗？”，给10个人看，看看反应。"]], "vi": ["Thái độ 1: Thử nghiệm nhỏ", ["Nghiên cứu thử nghiệm với 759 công ty: công ty làm “dự đoán → thử nghiệm nhỏ → kiểm chứng” có kết quả tốt hơn.", "Cách nghĩ này có thể học được. Ví dụ: hỏi “Bạn có muốn không?” trên mạng xã hội, cho 10 người xem và xem phản ứng."]], "mn": ["Хандлага 1: Жижгээр туршиж үзэх", ["759 компани дээр хийсэн туршилт: «таамаглах → жижгээр турших → шалгах»-ыг хийсэн компаниуд илүү сайн үр дүнд хүрсэн.", "Энэ сэтгэлгээг сурч болно. Жишээ: сошиал медиад «Авмаар байна уу?» гэж асууж, 10 хүнд үзүүлээд хариуг нь харах."]]}, {"ja": ["構え2：失ってもいい額を、先に決める", ["「いくらまで？」例：1万円。「いつまで？」例：3か月。", "だめでも、生活はこわれない。だから、こわくない。"]], "zh": ["心态2：先决定可以承受的损失", ["最多多少钱？例：1万日元。到什么时候？例：3个月。", "即使失败，生活也不会崩溃。所以不可怕。"]], "vi": ["Thái độ 2: Quyết định trước mức lỗ có thể chấp nhận", ["Tối đa bao nhiêu tiền? Ví dụ: 10.000 yên. Đến khi nào? Ví dụ: 3 tháng.", "Dù thất bại, cuộc sống vẫn không đổ vỡ. Vì vậy không đáng sợ."]], "mn": ["Хандлага 2: Алдаж болох хэмжээгээ урьдчилан шийдэх", ["Хэр их мөнгө хүртэл? Жишээ: 10,000 иен. Хэзээ хүртэл? Жишээ: 3 сар.", "Бүтэлгүйтсэн ч амьдрал сүйрэхгүй. Тиймээс айх хэрэггүй."]]}, {"ja": ["構え3：仲間をつくる", ["1人で始めた会社は36%。でも、投資家が出したお金のうち、1人で始めた会社に集まったのは、およそ15%だけ。", "始めるのは1人でも、育てるのは仲間。今日のチームも仲間です。"]], "zh": ["心态3：找到伙伴", ["一人创立的公司占36%。但在投资人投入的资金中，流向一人公司的只有约15%。", "一个人也能开始，但要靠伙伴一起成长。今天的小组也是伙伴。"]], "vi": ["Thái độ 3: Tìm đồng đội", ["36% công ty do 1 người lập. Nhưng trong tiền nhà đầu tư bỏ ra, công ty 1 người chỉ nhận khoảng 15%.", "Bắt đầu một mình cũng được, nhưng phát triển cần đồng đội. Nhóm hôm nay cũng là đồng đội."]], "mn": ["Хандлага 3: Хамтрагчтай болох", ["Ганц хүний эхлүүлсэн компани 36%. Гэвч хөрөнгө оруулагчдын оруулсан мөнгөнөөс ганц хүний компанид ердөө 15% орчим ногдсон.", "Ганцаараа эхэлж болно, харин өсгөхөд хамтрагч хэрэгтэй. Өнөөдрийн баг ч хамтрагч."]]}, {"ja": ["地雷TOP5：ふむ前に知れば、よけられる", ["1 在庫：つくりすぎて売れのこる → 注文を受けてからつくる", "2 お金がなくなる：売れても入金はあと → 入るお金と出るお金を見る ／ 3 まねする：ロゴ・絵・名前 → 商標・著作権を調べる", "4 広告・SNS：「やせる」「治る」は言えない、炎上にも注意 → 法律を知る ／ 5 仲間とけんか → お金と役割を最初に紙に書く"]], "zh": ["地雷TOP5：踩之前知道就能避开", ["1 库存：做太多卖不完 → 先接订单再生产", "2 钱用完：卖出去了钱也晚到 → 看清进出的钱 ／ 3 模仿：商标、图画、名字 → 查商标和著作权", "4 广告・社交媒体：不能说“能瘦”“能治好”，小心网络炎上 → 了解法律 ／ 5 和伙伴吵架 → 一开始就把钱和分工写在纸上"]], "vi": ["“Mìn” TOP5: Biết trước khi giẫm thì tránh được", ["1 Hàng tồn kho: làm quá nhiều, bán không hết → nhận đơn rồi mới làm", "2 Hết tiền: bán được nhưng tiền về sau → theo dõi tiền vào, tiền ra ／ 3 Bắt chước: logo, hình, tên → kiểm tra nhãn hiệu, bản quyền", "4 Quảng cáo・MXH: không được nói “giảm cân”, “chữa khỏi”, cẩn thận bị “ném đá” → hiểu luật ／ 5 Cãi nhau với đồng đội → viết ra giấy về tiền và vai trò từ đầu"]], "mn": ["«Мина» TOP5: Гишгэхээсээ өмнө мэдвэл зайлсхийж болно", ["1 Нөөц бараа: хэт их хийгээд зарагдахгүй → захиалга авсны дараа хийх", "2 Мөнгө дуусах: зарагдсан ч мөнгө хожуу орно → орох, гарах мөнгөө харах ／ 3 Хуулбарлах: лого, зураг, нэр → барааны тэмдэг, зохиогчийн эрхийг шалгах", "4 Зар・сошиал медиа: «тураана», «эдгээнэ» гэж хэлж болохгүй, шүүмжлэлд өртөхөөс болгоомжил → хуулиа мэдэх ／ 5 Хамтрагчтайгаа маргалдах → мөнгө, үүргээ эхнээс нь цаасан дээр бичих"]]}, {"ja": ["チームワーク②（25分）：アイデア → 0円テスト → リスク", ["③ こまりごとを、どう解決する？ アイデアを1つ", "④ 来週、0円でできるテストは？", "⑤ いちばん大きいリスクと、小さくする方法は？（地雷TOP5を見てもいい）"]], "zh": ["小组练习②（25分钟）：点子 → 零成本测试 → 风险", ["③ 怎么解决这个困扰？想一个点子", "④ 下周可以做的零成本测试是什么？", "⑤ 最大的风险是什么？怎么把它变小？（可以参考地雷TOP5）"]], "vi": ["Làm việc nhóm ② (25 phút): Ý tưởng → Thử nghiệm 0 yên → Rủi ro", ["③ Giải quyết vấn đề thế nào? Một ý tưởng", "④ Tuần sau có thể thử nghiệm gì với 0 yên?", "⑤ Rủi ro lớn nhất là gì và cách giảm nó? (có thể xem “mìn” TOP5)"]], "mn": ["Багийн ажил ② (25 минут): Санаа → 0 иенийн туршилт → Эрсдэл", ["③ Асуудлыг хэрхэн шийдэх вэ? Нэг санаа", "④ Ирэх долоо хоногт 0 иенээр ямар туршилт хийж болох вэ?", "⑤ Хамгийн том эрсдэл юу вэ, түүнийг хэрхэн багасгах вэ? («мина» TOP5-ыг харж болно)"]]}, {"ja": ["チームのワークシート（A3）", ["チームワーク①：① お客さん　② こまりごと", "チームワーク②：③ アイデア　④ 0円テスト　⑤ いちばん大きいリスク"]], "zh": ["小组工作表（A3）", ["小组练习①：① 顾客　② 困扰", "小组练习②：③ 点子　④ 零成本测试　⑤ 最大的风险"]], "vi": ["Phiếu làm việc nhóm (A3)", ["Nhóm ①: ① Khách hàng　② Vấn đề khó khăn", "Nhóm ②: ③ Ý tưởng　④ Thử nghiệm 0 yên　⑤ Rủi ro lớn nhất"]], "mn": ["Багийн ажлын хуудас (A3)", ["Баг ①: ① Хэрэглэгч　② Тулгамдсан асуудал", "Баг ②: ③ Санаа　④ 0 иенийн туршилт　⑤ Хамгийн том эрсдэл"]]}, {"ja": ["発表の準備（7分）：3分で話す5つの順番", ["① だれ？（顧客担当）　② こまりごと（マーケ担当）　③ アイデア（プロデューサー）", "④ 0円テスト　⑤ リスク（財務担当）。広報担当は、はじめのあいさつとおわりの一言。", "1人が話すのは30〜60秒だけ。1回通して練習しよう。"]], "zh": ["准备发表（7分钟）：3分钟发表的5个顺序", ["① 是谁？（顾客代表）　② 困扰（市场营销）　③ 点子（负责人）", "④ 零成本测试　⑤ 风险（财务）。宣传负责开头问候和结尾一句话。", "每人只说30〜60秒。整体练习一遍吧。"]], "vi": ["Chuẩn bị thuyết trình (7 phút): 5 bước trong 3 phút", ["① Ai? (Đại diện khách hàng)　② Vấn đề (Marketing)　③ Ý tưởng (Trưởng nhóm)", "④ Thử nghiệm 0 yên　⑤ Rủi ro (Tài chính). Truyền thông nói lời chào mở đầu và câu kết.", "Mỗi người chỉ nói 30–60 giây. Hãy tập một lượt."]], "mn": ["Илтгэлийн бэлтгэл (7 минут): 3 минутад ярих 5 дараалал", ["① Хэн? (Хэрэглэгчийн төлөөлөгч)　② Асуудал (Маркетинг)　③ Санаа (Продюсер)", "④ 0 иенийн туршилт　⑤ Эрсдэл (Санхүү). PR нь эхний мэндчилгээ, төгсгөлийн үгийг хэлнэ.", "Нэг хүн ердөө 30–60 секунд ярина. Нэг удаа бүтнээр нь давтаж үзээрэй."]]}, {"ja": ["発表：あなたは投資家。どのチームにお金を出す？", ["1チーム：発表3分＋先生から2分。", "全チームの発表が終わったら投票します。自分のチームには投票できません。"]], "zh": ["发表：你是投资人。你想投资哪个小组？", ["每组：发表3分钟＋老师点评2分钟。", "所有小组发表完后投票。不能投给自己的小组。"]], "vi": ["Thuyết trình: Bạn là nhà đầu tư. Bạn sẽ đầu tư nhóm nào?", ["Mỗi nhóm: thuyết trình 3 phút + giáo viên nhận xét 2 phút.", "Sau khi tất cả các nhóm thuyết trình xong thì bình chọn. Không chọn nhóm mình."]], "mn": ["Илтгэл: Та хөрөнгө оруулагч. Аль багт мөнгө оруулах вэ?", ["Нэг баг: илтгэл 3 минут + багшийн тайлбар 2 минут.", "Бүх баг илтгэж дууссаны дараа санал өгнө. Өөрийн багт санал өгөх боломжгүй."]], "link": "investor"}, {"ja": ["起業までの地図。今日はここまで来た。", ["STEP1 考える → STEP2 小さく試す（学生のうちに0円で） → STEP3 小さく売る（副業・個人事業）", "STEP4 仲間とお金 → STEP5 会社をつくる。働きながら経験をためるのも、この地図の中の道。", "留学生は、在留資格によって起業や副業のルールが違います。学校に確認してください。"]], "zh": ["通往创业的地图。今天走到了这里。", ["第1步 思考 → 第2步 小规模尝试（在学期间零成本） → 第3步 小规模销售（副业・个体经营）", "第4步 伙伴和资金 → 第5步 成立公司。一边工作一边积累经验，也是地图上的一条路。", "留学生的创业、副业规则因在留资格而不同。请向学校确认。"]], "vi": ["Bản đồ đến khởi nghiệp. Hôm nay bạn đã đi đến đây.", ["Bước 1 Suy nghĩ → Bước 2 Thử nghiệm nhỏ (khi còn là sinh viên, 0 yên) → Bước 3 Bán nhỏ (việc phụ, kinh doanh cá nhân)", "Bước 4 Đồng đội và tiền → Bước 5 Thành lập công ty. Vừa làm vừa tích lũy kinh nghiệm cũng là một con đường trên bản đồ.", "Với du học sinh, quy định về khởi nghiệp và làm thêm khác nhau tùy tư cách lưu trú. Hãy hỏi nhà trường."]], "mn": ["Бизнес эхлүүлэх хүртэлх газрын зураг. Өнөөдөр энд хүрлээ.", ["Алхам 1 Бодох → Алхам 2 Жижгээр турших (оюутан байхдаа 0 иенээр) → Алхам 3 Бага хэмжээгээр зарах (нэмэлт ажил, хувиараа)", "Алхам 4 Хамтрагч ба мөнгө → Алхам 5 Компани байгуулах. Ажиллангаа туршлага хуримтлуулах нь ч энэ зураг дээрх зам.", "Гадаад оюутнуудын хувьд бизнес, нэмэлт ажлын дүрэм оршин суух визийн төрлөөс хамаарч өөр. Сургуулиасаа лавлан xlHVHYQ8RHKACUv9D3q8nWrzkyCoH5w/viewform"}, VTT={"v1_ja": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:06.364\n2031年。いまから 5年後の 世界。\n\n2\n00:00:06.364 --> 00:00:12.727\n何が かわる？ 地図を 見てみよう。\n\n3\n00:00:12.727 --> 00:00:20.000\n世界を うごかす 力が 3つ あります。\n\n4\n00:00:20.000 --> 00:00:29.091\n1つめは AI。1人でも、しらべる・つくる・売るが できる。\n\n5\n00:00:29.091 --> 00:00:36.364\nでも、ほかの人も みんな できる。\n\n6\n00:00:36.364 --> 00:00:45.455\n2つめは 人口。日本は 人が へる。\n\n7\n00:00:45.455 --> 00:00:52.727\nでも 世界には、若い人が 多い国も たくさん ある。\n\n8\n00:00:52.727 --> 00:01:00.000\n3つめは K字の経済。\n\n9\n00:01:00.000 --> 00:01:07.273\nお金を 使う人と、使わない人に 分かれる。\n\n10\n00:01:07.273 --> 00:01:14.545\n1つめの 数字。\n\n11\n00:01:14.545 --> 00:01:23.636\n日本で 売っている 服が 100着 あるとします。\n\n12\n00:01:23.636 --> 00:01:32.727\n日本で つくった服は、何着 だと思う？\n\n13\n00:01:32.727 --> 00:01:41.818\nこたえは 1着。1.1% です。\n\n14\n00:01:41.818 --> 00:01:52.727\n2000年と くらべると、日本で つくる服は 10分の1に なった。\n\n15\n00:01:52.727 --> 00:02:03.636\n日本は、服を つくれない国に なった？\n\n16\n00:02:03.636 --> 00:02:10.909\nこれは チャンス？ それとも リスク？\n\n17\n00:02:10.909 --> 00:02:18.182\n2つめの 数字。\n\n18\n00:02:18.182 --> 00:02:29.091\n世界で 買い物をする人に 聞きました。今年、古着を 買う？\n\n19\n00:02:29.091 --> 00:02:40.000\n10人のうち 6人が「買う」と こたえた。59% です。\n\n20\n00:02:40.000 --> 00:02:52.727\n新しい服だけが、ファッションの 売りものでは ない。\n\n21\n00:02:52.727 --> 00:03:00.909\n古着、なおす、かりる。ぜんぶ ビジネスに なる。\n\n22\n00:03:00.909 --> 00:03:08.182\n3つめの 数字。\n\n23\n00:03:08.182 --> 00:03:19.091\n日本の 服の市場は、およそ 8.6兆円。\n\n24\n00:03:19.091 --> 00:03:30.000\n推し活に 使うお金は、およそ 3.8兆円。\n\n25\n00:03:30.000 --> 00:03:40.909\n服の市場の、およそ 半分の 大きさ。\n\n26\n00:03:40.909 --> 00:03:50.909\n服の会社の ライバルは、服の会社 だけ？\n\n27\n00:03:50.909 --> 00:03:58.182\n4つめの 数字。\n\n28\n00:03:58.182 --> 00:04:09.091\nアメリカで 新しくできた会社。1人で 始めた会社は、2019年は 24%。\n\n29\n00:04:09.091 --> 00:04:20.000\n2025年は 36%。6年で 1.5倍に なった。\n\n30\n00:04:20.000 --> 00:04:30.909\nAIが、仲間の かわりを してくれる ところが ある。\n\n31\n00:04:30.909 --> 00:04:40.909\n1人でも 始められる 時代。でも…。\n\n32\n00:04:40.909 --> 00:04:50.909\nチャンスと リスクは、同じコインの 表と うら。\n\n33\n00:04:50.909 --> 00:05:01.818\nAIで、1人でも 始められる。でも、みんなも 始められる。\n\n34\n00:05:01.818 --> 00:05:12.727\n古着で、新しい売り方が できる。でも、新品は 売れにくい。\n\n35\n00:05:12.727 --> 00:05:23.636\n推し活は、服の 新しい入口。でも、ほかの業界も 入ってくる。\n\n36\n00:05:23.636 --> 00:05:40.000\n同じことが、ある人には チャンス。ある人には リスク。\n\n37\n00:05:40.000 --> 00:05:50.909\nでは、チャンスと リスクを 分けるのは 何？\n\n38\n00:05:50.909 --> 00:06:00.000\nこたえは、構え（かまえ）です。\n\n39\n00:06:00.000 --> 00:06:09.091\n1. 小さく 試す。\n\n40\n00:06:09.091 --> 00:06:18.182\n2. 失ってもいい額を 先に決める。\n\n41\n00:06:18.182 --> 00:06:30.000\n3. 仲間を つくる。\n\n42\n00:06:30.000 --> 00:06:41.818\nつぎは ペアワーク。あなたの チャンスを 見つけよう。\n", "v1_zh": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:06.364\n2031年。五年后的世界。\n\n2\n00:00:06.364 --> 00:00:12.727\n会有什么变化？我们来看看地图吧。\n\n3\n00:00:12.727 --> 00:00:20.000\n推动世界的力量有三个。\n\n4\n00:00:20.000 --> 00:00:29.091\n第一个是AI。一个人也能调查、制作、销售。\n\n5\n00:00:29.091 --> 00:00:36.364\n但是，其他人也都能做到。\n\n6\n00:00:36.364 --> 00:00:45.455\n第二个是人口。日本的人口在减少。\n\n7\n00:00:45.455 --> 00:00:52.727\n但是世界上也有很多年轻人多的国家。\n\n8\n00:00:52.727 --> 00:01:00.000\n第三个是K型经济。\n\n9\n00:01:00.000 --> 00:01:07.273\n人们分成花钱的人和不花钱的人。\n\n10\n00:01:07.273 --> 00:01:14.545\n第一个数字。\n\n11\n00:01:14.545 --> 00:01:23.636\n假设日本卖的衣服有100件。\n\n12\n00:01:23.636 --> 00:01:32.727\n你觉得其中在日本制造的有几件？\n\n13\n00:01:32.727 --> 00:01:41.818\n答案是1件。1.1%。\n\n14\n00:01:41.818 --> 00:01:52.727\n和2000年相比，日本制造的衣服减少到十分之一。\n\n15\n00:01:52.727 --> 00:02:03.636\n日本变成了\"做不出衣服的国家\"吗？\n\n16\n00:02:03.636 --> 00:02:10.909\n这是机会？还是风险？\n\n17\n00:02:10.909 --> 00:02:18.182\n第二个数字。\n\n18\n00:02:18.182 --> 00:02:29.091\n我们问了全世界的消费者：今年会买二手衣服吗？\n\n19\n00:02:29.091 --> 00:02:40.000\n10个人里有6个人回答\"会买\"。59%。\n\n20\n00:02:40.000 --> 00:02:52.727\n时尚的商品不只有新衣服。\n\n21\n00:02:52.727 --> 00:03:00.909\n二手、修补、租借，都可以成为生意。\n\n22\n00:03:00.909 --> 00:03:08.182\n第三个数字。\n\n23\n00:03:08.182 --> 00:03:19.091\n日本的服装市场大约8.6万亿日元。\n\n24\n00:03:19.091 --> 00:03:30.000\n用于\"追星\"的钱大约3.8万亿日元。\n\n25\n00:03:30.000 --> 00:03:40.909\n大约是服装市场的一半。\n\n26\n00:03:40.909 --> 00:03:50.909\n服装公司的对手只有服装公司吗？\n\n27\n00:03:50.909 --> 00:03:58.182\n第四个数字。\n\n28\n00:03:58.182 --> 00:04:09.091\n美国新成立的公司中，一个人创立的公司在2019年占24%。\n\n29\n00:04:09.091 --> 00:04:20.000\n2025年是36%。6年变成了1.5倍。\n\n30\n00:04:20.000 --> 00:04:30.909\nAI可以在一些地方代替伙伴。\n\n31\n00:04:30.909 --> 00:04:40.909\n一个人也能开始的时代。但是……\n\n32\n00:04:40.909 --> 00:04:50.909\n机会和风险是同一枚硬币的正反面。\n\n33\n00:04:50.909 --> 00:05:01.818\n有了AI，一个人也能开始。但是，大家也都能开始。\n\n34\n00:05:01.818 --> 00:05:12.727\n二手衣服带来新的卖法。但是，新衣服变得难卖。\n\n35\n00:05:12.727 --> 00:05:23.636\n追星是衣服的新入口。但是，其他行业也会进来。\n\n36\n00:05:23.636 --> 00:05:40.000\n同一件事，对有的人是机会，对有的人是风险。\n\n37\n00:05:40.000 --> 00:05:50.909\n那么，区分机会和风险的是什么？\n\n38\n00:05:50.909 --> 00:06:00.000\n答案是\"心态\"。\n\n39\n00:06:00.000 --> 00:06:09.091\n1. 小规模尝试。\n\n40\n00:06:09.091 --> 00:06:18.182\n2. 先决定可以承受的损失。\n\n41\n00:06:18.182 --> 00:06:30.000\n3. 找到伙伴。\n\n42\n00:06:30.000 --> 00:06:41.818\n接下来是两人练习。找到你的机会吧。\n", "v1_vi": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:06.364\nNăm 2031. Thế giới 5 năm sau.\n\n2\n00:00:06.364 --> 00:00:12.727\nĐiều gì sẽ thay đổi? Hãy cùng xem bản đồ.\n\n3\n00:00:12.727 --> 00:00:20.000\nCó 3 sức mạnh làm thay đổi thế giới.\n\n4\n00:00:20.000 --> 00:00:29.091\nThứ nhất là AI. Một người cũng có thể tìm hiểu, làm ra và bán.\n\n5\n00:00:29.091 --> 00:00:36.364\nNhưng ai cũng có thể làm được như vậy.\n\n6\n00:00:36.364 --> 00:00:45.455\nThứ hai là dân số. Dân số Nhật Bản đang giảm.\n\n7\n00:00:45.455 --> 00:00:52.727\nNhưng trên thế giới có nhiều nước có nhiều người trẻ.\n\n8\n00:00:52.727 --> 00:01:00.000\nThứ ba là kinh tế hình chữ K.\n\n9\n00:01:00.000 --> 00:01:07.273\nNgười tiêu tiền và người không tiêu tiền bị chia ra.\n\n10\n00:01:07.273 --> 00:01:14.545\nCon số thứ nhất.\n\n11\n00:01:14.545 --> 00:01:23.636\nGiả sử có 100 chiếc áo đang được bán ở Nhật.\n\n12\n00:01:23.636 --> 00:01:32.727\nBạn nghĩ có bao nhiêu chiếc được làm ở Nhật?\n\n13\n00:01:32.727 --> 00:01:41.818\nCâu trả lời là 1 chiếc. 1,1%.\n\n14\n00:01:41.818 --> 00:01:52.727\nSo với năm 2000, quần áo làm ở Nhật chỉ còn 1/10.\n\n15\n00:01 -> 00:00:29.091\n759の会社で 実験した 研究が あります。\n\n5\n00:00:29.091 --> 00:00:40.000\n予想する。小さく試す。たしかめる。\n\n6\n00:00:40.000 --> 00:00:49.091\nこれをした会社は、結果が よかった。\n\n7\n00:00:49.091 --> 00:00:56.364\nそして この考え方は、学べる。\n\n8\n00:00:56.364 --> 00:01:05.455\nたとえば、SNSで「ほしい？」と 聞いてみる。\n\n9\n00:01:05.455 --> 00:01:12.727\n構え2。失ってもいい額を、先に決める。\n\n10\n00:01:12.727 --> 00:01:23.636\nいくらまで？ たとえば 1万円。\n\n11\n00:01:23.636 --> 00:01:32.727\nいつまで？ たとえば 3か月。\n\n12\n00:01:32.727 --> 00:01:46.364\nだめでも、生活は こわれない。だから、こわくない。\n\n13\n00:01:46.364 --> 00:01:53.636\n構え3。仲間を つくる。\n\n14\n00:01:53.636 --> 00:02:04.545\n1人で 始めた会社は 36%。\n\n15\n00:02:04.545 --> 00:02:17.273\nでも、投資家が 出したお金のうち、1人の会社に 集まったのは およそ15%。\n\n16\n00:02:17.273 --> 00:02:31.818\n始めるのは 1人でも、育てるのは 仲間。\n\n17\n00:02:31.818 --> 00:02:40.909\n最後に、地雷。ふむ前に 知れば、よけられる。\n\n18\n00:02:40.909 --> 00:02:53.636\n1. 在庫。つくりすぎて、売れのこる。注文を 受けてから つくろう。\n\n19\n00:02:53.636 --> 00:03:06.364\n2. お金が なくなる。売れても、お金が 入るのは あと。\n\n20\n00:03:06.364 --> 00:03:19.091\n3. まねする。ロゴや 絵や 名前。人のものは 使えない。\n\n21\n00:03:19.091 --> 00:03:33.636\n4. 広告と SNS。「やせる」「治る」は 言えない。炎上にも 注意。\n\n22\n00:03:33.636 --> 00:03:49.091\n5. 仲間と けんか。お金と 役割は、最初に 紙に 書いておこう。\n\n23\n00:03:49.091 --> 00:04:00.000\nつぎは チームワーク②。アイデアと 0円テストを 考えよう。\n", "v2_zh": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:05.455\n后半部分。优秀的创业者在做的事。\n\n2\n00:00:05.455 --> 00:00:10.909\n还有，需要注意的事。\n\n3\n00:00:10.909 --> 00:00:18.182\n心态1。小规模尝试。\n\n4\n00:00:18.182 --> 00:00:29.091\n有一项研究，对759家公司做了实验。\n\n5\n00:00:29.091 --> 00:00:40.000\n预测。小规模尝试。验证。\n\n6\n00:00:40.000 --> 00:00:49.091\n这样做的公司，结果更好。\n\n7\n00:00:49.091 --> 00:00:56.364\n而且，这种思考方式是可以学会的。\n\n8\n00:00:56.364 --> 00:01:05.455\n比如，在社交媒体上问\"想要吗？\"。\n\n9\n00:01:05.455 --> 00:01:12.727\n心态2。先决定可以承受的损失。\n\n10\n00:01:12.727 --> 00:01:23.636\n最多多少钱？比如1万日元。\n\n11\n00:01:23.636 --> 00:01:32.727\n到什么时候？比如3个月。\n\n12\n00:01:32.727 --> 00:01:46.364\n即使失败，生活也不会崩溃。所以不可怕。\n\n13\n00:01:46.364 --> 00:01:53.636\n心态3。找到伙伴。\n\n14\n00:01:53.636 --> 00:02:04.545\n一个人创立的公司占36%。\n\n15\n00:02:04.545 --> 00:02:17.273\n但是，在投资人投入的资金中，流向一人公司的只有约15%。\n\n16\n00:02:17.273 --> 00:02:31.818\n一个人也能开始，但要靠伙伴一起成长。\n\n17\n00:02:31.818 --> 00:02:40.909\n最后是\"地雷\"。踩之前知道，就能避开。\n\n18\n00:02:40.909 --> 00:02:53.636\n1. 库存。做太多，卖不完。先接订单再生产吧。\n\n19\n00:02:53.636 --> 00:03:06.364\n2. 钱用完了。即使卖出去，钱也要晚一点才到账。\n\n20\n00:03:06.364 --> 00:03:19.091\n3. 模仿。商标、图画、名字。别人的东西不能用。\n\n21\n00:03:19.091 --> 00:03:33.636\n4. 广告和社交媒体。不能说\"能瘦\"\"能治好\"。也要小心网络炎上。\n\n22\n00:03:33.636 --> 00:03:49.091\n5. 和伙伴吵架。钱和分工，一开始就写在纸上吧。\n\n23\n00:03:49.091 --> 00:04:00.000\n接下来是小组练习②。来想想点子和零成本测试吧。\n", "v2_vi": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:05.455\nPhần sau. Những điều người khởi nghiệp giỏi đang làm.\n\n2\n00:00:05.455 --> 00:00:10.909\nVà những điều cần chú ý.\n\n3\n00:00:10.909 --> 00:00:18.182\nThái độ 1. Thử nghiệm nhỏ.\n\n4\n00:00:18.182 --> 00:00:29.091\nCó một nghiên cứu đã thử nghiệm với 759 công ty.\n\n5\n00:00:29.091 --> 00:00:40.000\nDự đoán. Thử nghiệm nhỏ. Kiểm chứng.\n\n6\n00:00:40.000 --> 00:00:49.091\nNhững công ty làm như vậy có kết quả tốt hơn.\n\n7\n00:00:49.091 --> 00:00:56.364\nVà cách suy nghĩ này có thể học được.\n\n8\n00:00:56.364 --> 00:01:05.455\nVí dụ, hỏi \"Bạn có muốn không?\" trên mạng xã hội.\n\n9\n00:01:05.455 --> 00:01:12.727\nThái độ 2. Quyết định trước mức lỗ có thể chấp nhận.\n\n10\n00:01:12.727 --> 00:01:23.636\nTối đa bao nhiêu tiền? Ví dụ 10.000 yên.\n\n11\n00:01:23.636 --> 00:01:32.727\nĐến khi nào? Ví dụ 3 tháng.\n\n12\n00:01:32.727 --> 00:01:46.364\nDù thất bại, cuộc sống vẫn không đổ vỡ. Vì vậy không đáng sợ.\n\n13\n00:01:46.364 --> 00:01:53.636\nThái độ 3. Tìm đồng đội.\n\n14\n00:01:53.636 --> 00:02:04.545\nCông ty do 1 người thành lập là 36%.\n\n15\n00:02:04.545 --> 00:02:17.273\nNhưng trong số tiền nhà đầu tư bỏ ra, công ty 1 người chỉ nhận được khoảng 15%.\n\n16\n00:02:17.273 --> 00:02:31.818\nBắt đầu một mình cũng được, nhưng phát triển thì cần đồng đội.\n\n17\n00:02:31.818 --> 00:02:40.909\nCuối cùng là \"mìn\". Biết trước khi giẫm thì có thể tránh.\n\n18\n00:02:40.909 --> 00:02:53.636\n1. Hàng tồn kho. Làm quá nhiều, bán không hết. Hãy nhận đơn rồi mới làm.\n\n19\n00:02:53.636 --> 00:03:06.364\n2. Hết tiền. Dù bán được, tiền vẫn về sau.\n\n20\n00:03:06.364 --> 00:03:19.091\n3. Bắt chước. Logo, hình vẽ, tên. Không được dùng đồ của người khác.\n\n21\n00:03:19.091 --> 00:03:33.636\n4. Quảng cáo và mạng xã hội. Không được nói \"giảm cân\", \"chữa khỏi\". Cũng cẩn thận bị \"ném đá\".\n\n22\n00:03:33.636 --> 00:03:49.091\n5. Cãi nhau với đồng đội. Hãy viết ra giấy về tiền và vai trò ngay từ đầu.\n\n23\n00:03:49.091 --> 00:04:00.000\nTiếp theo là làm việc nhóm ②. Hãy nghĩ ý tưởng và thử nghiệm 0 yên.\n", "v2_mn": "WEBVTT\n\n1\n00:00:00.000 --> 00:00:05.455\nХоёрдугаар хэсэг. Сайн бизнес эрхлэгчид юу хийдэг вэ.\n\n2\n00:00:05.455 --> 00:00:10.909\nМөн юунд анхаарах вэ.\n\n3\n00:00:10.909 --> 00:00:18.182\nХандлага 1. Жижгээр туршиж үзэх.\n\n4\n00:00:18.182 --> 00:00:29.091\n759 компани дээр туршилт хийсэн судалгаа бий.\n\n5\n00:00:29.091 --> 00:00:40.000\nТаамаглах. Жижгээр турших. Шалгах.\n\n6\n00:00:40.000 --> 00:00:49.091\nИнгэж хийсэн компаниуд илүү сайн үр дүнд хүрсэн.\n\n7\n00:00:49.091 --> 00:00:56.364\nМөн энэ сэтгэлгээг сурч болно.\n\n8\n00:00:56.364 --> 00:01:05.455\nЖишээ нь, сошиал медиад \"Авмаар байна уу?\" гэж асуух.\n\n9\n00:01:05.455 --> 00:01:12.727\nХандлага 2. Алдаж болох хэмжээгээ урьдчилан шийдэх.\n\n10\n00:01:12.727 --> 00:01:23.636\nХэр их мөнгө хүртэл вэ? Жишээ нь 10,000 иен.\n\n11\n00:01:23.636 --> 00:01:32.727\nХэзээ хүртэл вэ? Жишээ нь 3 сар.\n\n12\n00:01:32.727 --> 00:01:46.364\nБүтэлгүйтсэн ч амьдрал сүйрэхгүй. Тиймээс айх хэрэггүй.\n\n13\n00:01:46.364 --> 00:01:53.636\nХандлага 3. Хамтрагчтай болох.\n\n14\n00:01:53.636 --> 00:02:04.545\nГанц хүний эхлүүлсэн компани 36%.\n\n15\n00:02:04.545 --> 00:02:17.273\nГэвч хөрөнгө оруулагчдын оруулсан мөнгөнөөс ганц хүний компанид ердөө 15% орчим ногдсон.\n\n16\n00:02:17.273 --> 00:02:31.818\nГанцаараа эхэлж болно, харин өсгөхөд хамтрагч хэрэгтэй.\n\n17\n00:02:31.818     var act=$('act');act.innerHTML='';
    if(d.link){var a=document.createElement('a');a.href=FORM[d.link];a.target='_blank';a.rel='noopener';a.textContent=u('form')+' →';act.appendChild(a)}
    if(d.video){var vb=document.createElement('button');vb.type='button';vb.textContent='▶ '+u('watch').replace('{n}',d.video===1?'①':'②');vb.onclick=function(){setTab('video');var v=$('v'+d.video);$('vc'+d.video).scrollIntoView({block:'start'});try{v.focus()}catch(e){}};act.appendChild(vb)}
    act.hidden=!act.children.length;
    var o=$('orig');o.hidden=(lang==='ja');$('origSum').textContent=u('orig');$('oTtl').textContent=d.ja[0];fill($('oPts'),d.ja[1]);
    [].forEach.call(strip.children,function(b){var on=+b.dataset.n===cur;b.setAttribute('aria-current',on?'true':'false');if(on){var l=b.offsetLeft-strip.clientWidth/2+22;strip.scrollTo({left:l,behavior:'smooth'})}});
    $('pos').textContent=cur+' / '+N;$('prev').disabled=cur<=1;$('next').disabled=cur>=N;
  }
  function go(n){cur=Math.max(1,Math.min(N,n));put('g2031.slide',String(cur));renderSlide();try{history.replaceState(null,'','#s'+cur)}catch(e){};window.scrollTo({top:0})}
  $('prev').onclick=function(){go(cur-1)};$('next').onclick=function(){go(cur+1)};

  // swipe on card
  var sx=null,sy=null;
  $('card').addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  $('card').addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?cur+1:cur-1);sx=null});

  function setTab(t){tab=t;['slides','video','words'].forEach(function(k){$('p-'+k).hidden=(k!==t);$('t-'+k).setAttribute('aria-selected',k===t?'true':'false')});$('bar').hidden=(t!=='slides');document.body.style.paddingBottom=(t==='slides')?'96px':'24px'}
  $('t-slides').onclick=function(){setTab('slides')};$('t-video').onclick=function(){setTab('video')};$('t-words').onclick=function(){setTab('words')};

  var TL={ja:'日本語',zh:'中文',vi:'Tiếng Việt',mn:'Монгол'};
  ['v1','v2'].forEach(function(id){var v=$(id);['zh','vi','mn','ja'].forEach(function(l){var txt=VTT[id+'_'+l];if(!txt)return;
    var t=document.createElement('track');t.kind='subtitles';t.srclang=l;t.label=TL[l];
    try{t.src=URL.createObjectURL(new Blob([txt],{type:'text/vtt'}))}catch(e){return}
    v.appendChild(t)})});
  function setTracks(){['v1','v2'].forEach(function(id){var v=$(id);for(var i=0;i<v.textTracks.length;i++){var tr=v.textTracks[i];tr.mode=(tr.language===lang)?'showing':'disabled'}})}
  ['v1','v2'].forEach(function(id){var v=$(id);v.addEventListener('loadedmetadata',setTracks)});

  function renderWords(){
    var w=$('wlist');w.innerHTML='';
    var h=document.createElement('p');h.className='note';h.textContent=u('wordsTitle');w.appendChild(h);
    G.forEach(function(g){var c=document.createElement('div');c.className='w';
      var j=document.createElement('div');j.className='j';j.setAttribute('lang','ja');
      if(g[1]){var r=document.createElement('ruby');r.textContent=g[0];var rt=document.createElement('rt');rt.textContent=g[1];r.appendChild(rt);j.appendChild(r)}else j.textContent=g[0];
      c.appendChild(j);
      var map={zh:2,vi:3,mn:4};
      if(lang==='ja'){['zh','vi','mn'].forEach(function(k){var t=document.createElement('div');t.className='t';t.setAttribute('lang',LTAG[k]);t.textContent=g[map[k]];c.appendChild(t)})}
      else{var t=document.createElement('div');t.className='t';t.setAttribute('lang',LTAG[lang]);t.textContent=g[map[lang]];c.appendChild(t)}
      w.appendChild(c)});
  }

  function applyLang(l){
    lang=l;put('g2031.lang',l);document.documentElement.lang=LTAG[l];
    $('langBtn').textContent=UI[l].lang+'：'+UI[l].name;
    $('t-slides').textContent=u('slides');$('t-video').textContent=u('video');$('t-words').textContent=u('words');
    $('prev').textContent='← '+u('prev');$('next').textContent=u('next')+' →';
    $('hint').textContent=u('hint');$('hint').setAttribute('lang',LTAG[l]);
    $('vhint').textContent=u('vhint');$('vhint').setAttribute('lang',LTAG[l]);
    $('v1t').textContent=u('v1');$('v2t').textContent=u('v2');
    setTracks();renderSlide();renderWords();
  }

  var picker=$('picker');
  picker.addEventListener('click',function(e){var b=e.target.closest('button[data-l]');if(!b)return;picker.hidden=true;applyLang(b.dataset.l)});
  $('langBtn').onclick=function(){picker.hidden=false};

  var m=(location.hash||'').match(/^#s(\d+)$/);
  cur=m?+m[1]:(+get('g2031.slide')||1);
  var saved=get('g2031.lang');
  if(saved&&UI[saved]){applyLang(saved)}else{applyLang('ja');picker.hidden=false}
  setTab('slides');
})();
</script>
