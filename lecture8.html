<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRODUCE LAB Day 2 ｜ 手取りの正体</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* ── 投影専用：常にベージュ固定。ダークモード対応なし ── */
:root{
  --paper:#EFEDE6;
  --panel:#F8F7F2;
  --ink:#1A1E19;
  --ink-2:#4A524A;
  --ink-3:#7E857D;
  --rule:#C4C1B6;
  --brand:#A32A45;
  --mkt:#1F4E86;
  --acct:#1F6B4E;
  --gold:#8A6A1C;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);overflow:hidden}
body{color:var(--ink);
  font-family:"Zen Kaku Gothic New",system-ui,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-weight:500;line-height:1.65;-webkit-font-smoothing:antialiased}
.mincho,h1,h2,h3{font-family:"Shippori Mincho B1",serif;font-weight:700;line-height:1.3}

/* 固定キャンバス 1280×720 を画面に合わせて拡大縮小 */
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--paper)}
#deck{width:1280px;height:720px;position:relative;transform-origin:center center;background:var(--paper)}

.slide{position:absolute;inset:0;display:none;flex-direction:column;
  padding:56px 84px 60px;}
.slide.on{display:flex}
.body{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.slide.top .body{justify-content:flex-start;padding-top:8px}

.topbar{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:2px solid var(--rule);padding-bottom:10px;margin-bottom:26px;flex:0 0 auto}
.topbar .l{font-size:17px;letter-spacing:.14em;color:var(--ink-3)}
.topbar .r{font-size:17px;letter-spacing:.1em;color:var(--gold);font-weight:700}
.footbar{display:flex;justify-content:space-between;align-items:flex-end;
  margin-top:22px;flex:0 0 auto;font-size:16px;color:var(--ink-3)}

h1{font-size:66px;letter-spacing:.01em}
h2{font-size:46px;margin-bottom:26px}
h3{font-size:32px}
.kick{font-size:19px;letter-spacing:.2em;color:var(--gold);font-weight:700;margin-bottom:18px}
.lead{font-size:28px;color:var(--ink-2);max-width:31em}
.lead b{color:var(--ink)}
.lead+.lead{margin-top:18px}
p+p{margin-top:16px}
ul{padding-left:1.25em;font-size:27px}
li{margin-bottom:.5em}
li b{font-weight:700}
.note{font-size:20px;color:var(--ink-3);margin-top:26px;line-height:1.6}
.hl{background:linear-gradient(transparent 56%,#E8D89A 56%);padding:0 .12em}

.qbox{border:4px solid var(--ink);background:var(--panel);padding:40px 46px}
.qbox p{font-family:"Shippori Mincho B1",serif;font-weight:700;font-size:42px;line-height:1.45}
.qbox p.sm{font-size:34px}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:52px;align-items:center}
.tile{border-top:7px solid;padding:20px 0 0}
.tile h3{font-size:32px;margin-bottom:10px}
.tile p{font-size:22px;color:var(--ink-2);line-height:1.55}
.tb{border-color:var(--brand)} .tb h3{color:var(--brand)}
.tm{border-color:var(--mkt)} .tm h3{color:var(--mkt)}
.ta{border-color:var(--acct)} .ta h3{color:var(--acct)}

table{width:100%;border-collapse:collapse;font-size:25px}
td,th{border-bottom:2px solid var(--rule);padding:13px 10px;text-align:left}
th{font-size:19px;color:var(--ink-3);letter-spacing:.06em;border-bottom:3px solid var(--ink-3);font-weight:700}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{border-top:3px solid var(--ink);border-bottom:4px solid var(--ink);
  font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:34px;padding:16px 10px}
tr.tot td.n{color:var(--acct)}
.sub{color:var(--ink-3);font-size:19px}

.big{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:110px;line-height:1}
.mid{font-family:"Shippori Mincho B1",serif;font-weight:800;font-size:66px;line-height:1.1}
.card{background:var(--panel);border:2px solid var(--rule);padding:30px 34px}
.card h3{margin-bottom:14px}
.card p,.card li{font-size:24px;color:var(--ink-2);line-height:1.6}
.card p b{color:var(--ink)}
.warn{border:4px solid var(--brand);background:var(--panel);padding:32px 38px}
.warn h3{color:var(--brand);font-size:36px;margin-bottom:16px}
.warn p,.warn li{font-size:25px;color:var(--ink-2)}
.warn ul{font-size:25px;padding-left:1.2em}

.flow{display:flex;align-items:stretch;gap:0;margin-top:10px}
.flow .st{flex:1;border-left:6px solid var(--rule);padding:16px 20px}
.flow .st.on{border-color:var(--gold);background:var(--panel)}
.flow .st b{display:block;font-family:"Shippori Mincho B1",serif;font-size:26px;margin-bottom:4px}
.flow .st span{font-size:18px;color:var(--ink-3)}

.arrowline{display:flex;align-items:center;gap:18px;font-family:"Shippori Mincho B1",serif;
  font-size:34px;font-weight:800;margin-top:8px}
.arrowline i{font-style:normal;color:var(--gold);font-size:30px}

.ctrl{position:fixed;bottom:16px;right:20px;display:flex;gap:8px;z-index:9}
.ctrl button{background:var(--panel);border:2px solid var(--rule);color:var(--ink-2);
  padding:8px 16px;font-size:16px;cursor:pointer;font-family:inherit;font-weight:700}
.ctrl button:hover{border-color:var(--ink);color:var(--ink)}
</style>
</head>
<body>
<div id="viewport"><div id="deck"></div></div>
<div class="ctrl"><button id="prev">←</button><button id="next">→</button></div>
<script>
const D=[
/*1*/{t:'0–2分',b:`
 <p class="kick">BEAUTY SKILL VALUE LAB ／ DAY 2</p>
 <h1>手取りの正体</h1>
 <p class="lead" style="margin-top:26px">今日プロデュースする範囲は「自分の手取り」。<br>
 働いて得たお金が、なぜ<b>その金額</b>になるのかを見ます。</p>`},

/*2*/{t:'2–5分',top:1,b:`
 <p class="kick">前回のおさらい</p>
 <h2>Day 1 でやったこと</h2>
 <ul>
  <li>プロデュース＝カタチにして、世に出して、影響力を持たせること</li>
  <li>道具は3つ。<b>灯台</b>（ブランド）／<b>航路</b>（マーケ）／<b>羅針盤</b>（会計）</li>
  <li>実質時給＝手取り ÷（施術時間＋準備・移動）</li>
 </ul>
 <p class="note">休んだ人も大丈夫です。今日は前回の続きではなく、今日の1問で完結します。</p>`},

/*3*/{t:'5–6分',b:`
 <p class="kick">今日の判断</p>
 <div class="qbox"><p>初任給、月給20万円。<br><br>手元にいくら残る？<br>そして、何が引かれている？</p></div>`},

/*4*/{t:'6–14分',b:`
 <h2>まず出す</h2>
 <p class="lead">フォームAに、2つだけ書いてください。</p>
 <ul style="margin-top:24px">
  <li>手取りはいくらだと思うか（金額）</li>
  <li>引かれているものの名前（思いつくだけ）</li>
 </ul>
 <p class="note">調べない。金額は当てなくていい。7分。</p>`},

/*5*/{t:'14–16分',b:`
 <h2>ペアで見せ合う</h2>
 <p class="lead">相手が書いていて、<b>自分が書いていなかったもの</b>を1つだけ書き足す。</p>
 <p class="note">2分。感想はいりません。書き足すだけ。</p>`},

/*6*/{t:'16–19分',top:1,b:`
 <h2>よく出てくる答え</h2>
 <ul>
  <li>手取りは「17〜18万くらい」</li>
  <li>引かれるもの＝「税金」「年金」「保険」</li>
 </ul>
 <p class="lead" style="margin-top:34px">名前はほぼ全員が正解しています。<br>
 問題は、<span class="hl">いくらなのか、そして<b>なぜその額なのか</b></span>を誰も知らないこと。</p>`},

/*7*/{t:'19–24分',top:1,b:`
 <p class="kick">層1 ／ 事実</p>
 <h2>実際の給与明細</h2>
 <table>
  <tr><th>項目</th><th>料率</th><th style="text-align:right">本人の負担</th></tr>
  <tr><td>健康保険 <span class="sub">協会けんぽ東京</span></td><td>9.85%（労使折半）</td><td class="n">9,850円</td></tr>
  <tr><td>厚生年金</td><td>18.3%（労使折半）</td><td class="n">18,300円</td></tr>
  <tr><td>子ども・子育て支援金 <span class="sub">2026年4月〜</span></td><td>0.23%（労使折半）</td><td class="n">230円</td></tr>
  <tr><td>雇用保険</td><td>0.5%</td><td class="n">1,000円</td></tr>
  <tr><td>所得税</td><td>—</td><td class="n">約 3,000円</td></tr>
  <tr class="tot"><td>手取り</td><td></td><td class="n">約 167,600円</td></tr>
 </table>
 <p class="note">東京都・22歳・扶養なし・介護保険なし／2026年度の料率。所得税は概算です。</p>`},

/*8*/{t:'24–26分',b:`
 <div class="grid2">
  <div><p class="kick">みんなの予想</p><p class="mid" style="color:var(--ink-3)">17〜18万</p></div>
  <div><p class="kick">実際</p><p class="big" style="color:var(--acct)">16.7万</p></div>
 </div>
 <p class="lead" style="margin-top:44px">社会保険だけで <b>29,380円</b>。所得税は約3,000円。<br>
 みんなが最初に挙げた「税金」より、<span class="hl">社会保険のほうがずっと大きい</span>。</p>`},

/*9*/{t:'26–30分',top:1,b:`
 <h2>給与明細で見るのは、3か所だけ</h2>
 <div class="grid3" style="margin-top:14px">
  <div class="tile tb"><h3>① 総支給</h3><p>会社が「あなたの給料」として計上した額。求人票に載っているのはここ。</p></div>
  <div class="tile tm"><h3>② 控除</h3><p>社会保険と税。<b>何を、いくら引かれたか</b>。ここを読める人が少ない。</p></div>
  <div class="tile ta"><h3>③ 差引支給</h3><p>実際に振り込まれる額。生活の設計はここを基準にする。</p></div>
 </div>
 <p class="note">求人の「月給20万円」は①の話です。②を知らないと、①だけで生活設計をしてしまいます。</p>`},

/*10*/{t:'30–32分',b:`
 <p class="kick">層2 ／ ミクロ経済</p>
 <div class="qbox"><p class="sm">では、そもそも。<br><br>あなたの給料「20万円」は、<br>誰が、どうやって決めているのか。</p></div>`},

/*11*/{t:'32–37分',top:1,b:`
 <h2>賃金も、需要と供給で決まる</h2>
 <div class="grid2" style="margin-top:10px">
  <div class="card"><h3 style="color:var(--brand)">人が足りない</h3>
   <p>採りたい会社が多く、来る人が少ない。<br>→ <b>給料を上げないと採れない</b></p></div>
  <div class="card"><h3 style="color:var(--mkt)">人が余っている</h3>
   <p>やりたい人が多く、席が少ない。<br>→ <b>安くても人が来る</b></p></div>
 </div>
 <p class="lead" style="margin-top:34px">給料は「頑張り」で決まるのではなく、<br><b>その仕事に、人が足りているかどうか</b>で決まります。</p>
 <p class="note">これは冷たい話ではありません。<b>自分がどちら側に立つかを選べる</b>、という話です。</p>`},

/*12*/{t:'37–42分',top:1,b:`
 <h2>代わりが、いるか・いないか</h2>
 <div class="arrowline"><span>代わりがいる</span><i>→</i><span style="color:var(--brand)">価格は下がる</span></div>
 <div class="arrowline"><span>代わりがいない</span><i>→</i><span style="color:var(--acct)">価格は上がる</span></div>
 <p class="lead" style="margin-top:36px">美容の技術は、<b>身につけるのに時間がかかる</b>。<br>
 だから本来は「代わりがいない」側の仕事です。</p>
 <p class="note">ただし、同じ技術を持つ人が毎年たくさん卒業してくる。<br>
 <b>技術があること</b>と、<b>代わりがいないこと</b>は、同じではありません。ここがDay 1でやった「プロデュース」の話につながります。</p>`},

/*13*/{t:'42–46分',top:1,b:`
 <h2>会社が払っている、本当の額</h2>
 <table>
  <tr><th>会社が負担しているもの</th><th style="text-align:right">金額</th></tr>
  <tr><td>健康保険・厚生年金・支援金（会社の半分）</td><td class="n">28,380円</td></tr>
  <tr><td>雇用保険 0.85%</td><td class="n">1,700円</td></tr>
  <tr><td>子ども・子育て拠出金 0.36%（会社のみ）</td><td class="n">720円</td></tr>
  <tr><td>労災保険（会社のみ）</td><td class="n">約 600円</td></tr>
  <tr class="tot"><td>会社が払う総額</td><td class="n">約 231,400円</td></tr>
 </table>
 <p class="note">労使折半とは、あなたが払った額と<b>同じ額を会社も払っている</b>ということ。</p>`},

/*14*/{t:'46–50分',b:`
 <div class="grid2">
  <div><p class="kick">あなたが受け取る</p><p class="mid">16.7万</p></div>
  <div><p class="kick">会社が払う</p><p class="big" style="color:var(--brand)">23.1万</p></div>
 </div>
 <div class="qbox" style="margin-top:38px"><p class="sm">会社が人を雇い続けられるのは、<br>
 <b>その人が生む価値 ＞ 23.1万円</b> のときだけ。</p></div>`},

/*15*/{t:'50–54分',top:1,b:`
 <h2>美容の労働市場で、いま起きていること</h2>
 <ul>
  <li><b>人手は足りていない。</b>採用にも定着にも苦労している</li>
  <li>それでも<b>初任給が大きく上がりにくい</b>。理由は、店が客から受け取る単価が上がりにくいから</li>
  <li>会社は、売上以上の給料は払えない。<span class="hl">賃金の天井は、客単価が決めている</span></li>
 </ul>
 <p class="note">「頑張っているのに給料が上がらない」の正体は、たいていここにあります。<br>
 だから <b>Day 4（市場）</b> と <b>Day 5（店舗の数字）</b> が、自分の給料の話に直結してきます。</p>`},

/*16*/{t:'54–56分',b:`
 <p class="kick">層3 ／ マクロ経済</p>
 <div class="qbox"><p class="sm">もう一段、大きな「なぜ」。<br><br>
 なぜ社会保険料は、<br>毎年のように上がり続けるのか。</p></div>`},

/*17*/{t:'56–62分',top:1,b:`
 <h2>いま働いている人が、いまの高齢者を支えている</h2>
 <p class="lead">年金も医療も、自分のために積み立てているのではありません。<br>
 <b>今の現役世代が払ったお金を、今の高齢者に配っている</b>（賦課方式）。</p>
 <div class="grid3" style="margin-top:30px">
  <div class="tile tb"><h3>1965年</h3><p><b>約9.1人</b>で1人を支える<br><span class="sub">胴上げ型</span></p></div>
  <div class="tile tm"><h3>2012年ごろ</h3><p><b>約2.4人</b>で1人<br><span class="sub">騎馬戦型</span></p></div>
  <div class="tile ta"><h3>2050年ごろ</h3><p><b>1.3人前後</b>で1人<br><span class="sub">肩車型</span></p></div>
 </div>
 <p class="note">支える人が減れば、1人あたりの負担は増える。<b>料率が上がるのは、政治の意地悪ではなく人口の算数です。</b>（内閣府・社人研の推計）</p>`},

/*18*/{t:'62–68分',top:1,b:`
 <h2>なぜ30年、給料は上がらなかったのか</h2>
 <ul>
  <li><b>物価が上がらなかった</b>ので、会社は値上げできなかった</li>
  <li>値上げできないから、<b>給料も上げられなかった</b></li>
  <li>給料が上がらないから、みんな買わない。だから物価も上がらない</li>
 </ul>
 <div class="qbox" style="margin-top:30px"><p class="sm">物価と賃金が、30年止まっていた。<br>これが<b>デフレ</b>と低成長の正体です。</p></div>
 <p class="note">みなさんの親世代は、この30年の中で働いてきました。<b>「値上げは悪いこと」という感覚</b>は、この時代に作られたものです。</p>`},

/*19*/{t:'68–74分',top:1,b:`
 <h2>インフレには、2種類あります</h2>
 <div class="grid2" style="margin-top:8px">
  <div class="card"><h3 style="color:var(--acct)">需要が強くて上がる</h3>
   <p>みんなが欲しがるから値段が上がる。売れるので給料も上がる。<br><b>景気が良いインフレ</b></p></div>
  <div class="card"><h3 style="color:var(--brand)">コストが上がって上がる</h3>
   <p>円安・資源高で仕入れが高くなり、仕方なく値上げする。給料は追いつかない。<br><b>苦しいインフレ</b></p></div>
 </div>
 <p class="lead" style="margin-top:34px">日本でいま起きているのは、<b>2つ目から始まって、1つ目に移れるかどうか</b>の途中です。</p>
 <p class="note">2026年7月の企業物価は前年より <b>+7.2%</b>。円安と資源高が続いています。</p>`},

/*20*/{t:'74–79分',top:1,b:`
 <h2>いま、実際に動いている数字</h2>
 <table>
  <tr><td>2026年 春闘の賃上げ率</td><td class="n"><b>5.01%</b> <span class="sub">3年連続5%台／中小4.69%</span></td></tr>
  <tr><td>名目賃金（2026年5月）</td><td class="n">前年比 <b>+3.2%</b></td></tr>
  <tr><td>実質賃金（2026年5月）</td><td class="n">前年比 <b>+1.4%</b> <span class="sub">5か月連続プラス</span></td></tr>
  <tr><td>その前（2025年1〜12月）</td><td class="n" style="color:var(--brand)"><b>12か月連続マイナス</b></td></tr>
  <tr><td>日銀の政策金利</td><td class="n"><b>1.00%</b> <span class="sub">約31年ぶりの水準</span></td></tr>
 </table>
 <p class="note">みなさんは、<b>30年ぶりに物価も賃金も金利も動き始めた時代</b>に社会へ出ます。<br>親や先生の「常識」が当てはまらない可能性がある、ということです。</p>`},

/*21*/{t:'79–83分',top:1,b:`
 <h2>だから、見るのは「実質」</h2>
 <div class="arrowline" style="font-size:38px"><span>名目 +3.2%</span><i>−</i><span>物価 約1.8%</span><i>=</i><span style="color:var(--acct)">実質 +1.4%</span></div>
 <p class="lead" style="margin-top:36px">給料が3%上がっても、物が4%高くなっていれば、<br><b>買えるものは減っています</b>。</p>
 <p class="lead">給与明細の額（名目）だけを見ていると、<span class="hl">生活が楽になったかどうかは分かりません</span>。</p>
 <p class="note">これはDay 3「お金を置く場所」に直結します。銀行に置いたお金にも、同じことが起きています。</p>`},

/*22*/{t:'83–86分',b:`
 <p class="kick">統合</p>
 <h2>あなたの手取りは、2つの掛け算</h2>
 <div class="grid2" style="margin-top:10px">
  <div class="card"><h3 style="color:var(--mkt)">ミクロ</h3>

const deck=document.getElementById('deck');
D.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide'+(s.top?' top':'');
  el.innerHTML=`<div class="topbar"><span class="l">PRODUCE LAB ／ DAY 2　手取りの正体</span><span class="r">${s.t}</span></div>
    <div class="body">${s.b}</div>
    <div class="footbar"><span>Beauty Skill Value Lab</span><span>${i+1} / ${D.length}</span></div>`;
  deck.appendChild(el);
});
let cur=0;
function show(n){
  cur=Math.max(0,Math.min(D.length-1,n));
  [...deck.children].forEach((el,i)=>el.classList.toggle('on',i===cur));
  try{localStorage.setItem('produce-day2v2',cur)}catch(e){}
}
function fit(){
  const s=Math.min(innerWidth/1280, innerHeight/720);
  deck.style.transform='scale('+s+')';
}
addEventListener('resize',fit);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(cur+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(cur-1)}
  if(e.key==='Home')show(0); if(e.key==='End')show(D.length-1);
});
let sx=null;
addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{if(sx===null)return;const d=e.changedTouches[0].clientX-sx;
  if(Math.abs(d)>60)show(cur+(d<0?1:-1));sx=null;},{passive:true});
fit();
let st=0; try{st=parseInt(localStorage.getItem('produce-day2v2'))||0}catch(e){}
show(st);
</script>
